# Messa API — Fly.io (docs/08-operations/deploy.md)
#
# Lições do incidente comparador-fichas: NUNCA hibernar (WebSocket + jobs), sempre 1 máquina no ar,
# health checks para reinício automático, zero estado em memória (tudo no Postgres).
app = "messa-api"
primary_region = "gru"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Migrations rodam ANTES da nova versão subir (expand/contract obrigatório).
  release_command = "node node_modules/@messa/db/dist/migrate.js"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  API_PORT = "8080"
  LOG_LEVEL = "info"
  UPLOADS_DIR = "/data/uploads"
  API_PUBLIC_URL = "https://api.messa-garcom.com.br"
  WEB_PUBLIC_URL = "https://messa-garcom.com.br"
  QR_BASE_URL = "https://messa-garcom.com.br"
  # Segredos via `fly secrets set`: DATABASE_URL DATABASE_MIGRATOR_URL JWT_SECRET COOKIE_SECRET PIN_ENCRYPTION_KEY RESEND_API_KEY

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  # `/health` e não `/ready`: o check bate a cada 15 s, e `/ready` consulta o
  # banco — sozinho isso impedia o Postgres de suspender e consumia a franquia
  # mensal inteira. Pior: com o banco indisponível o check reprovava, o proxy
  # tirava a máquina da rede e a API sumia por completo. O cliente recebia
  # "Failed to fetch" em vez de um erro legível, e reiniciar a máquina nunca
  # consertou banco fora do ar. `/ready` continua existindo para diagnóstico.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/health"

# Uploads de imagens (logo, fotos de produtos) persistem entre deploys.
# Criar uma vez: fly volumes create messa_data --region gru --size 1
[mounts]
  source = "messa_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
