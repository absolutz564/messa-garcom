<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão — Messa</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #fafafa; color: #171717; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card { max-width: 380px; text-align: center; }
      .badge {
        width: 56px; height: 56px; border-radius: 16px; background: #e11d48; color: #fff;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
        font-size: 28px; font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #525252; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        background: #e11d48; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">M</div>
      <h1>Sem conexão</h1>
      <p>
        O celular está sem internet. Os pedidos e as mesas continuam guardados no servidor —
        nada foi perdido. Assim que o sinal voltar, é só recarregar.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
